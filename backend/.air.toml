# Air 热重载配置
# 文档: https://github.com/air-verse/air
# 修改 .go 文件后自动重新编译并重启服务,无需手动 Ctrl+C + go run

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 编译入口:cmd/server/main.go ({{.exe}} 在 Windows 下自动替换为 .exe,其他系统为空)
  cmd = "go build -o ./tmp/server{{.exe}} ./cmd/server"
  bin = "./tmp/server{{.exe}}"
  # 监听文件变化的扩展名(.go 代码 + .sql 迁移 + .yaml 配置)
  include_ext = ["go", "sql", "yaml", "yml"]
  # 排除的目录
  exclude_dir = ["tmp", "vendor", "testdata", "configs"]
  # 排除的文件
  exclude_file = []
  # 构建延迟(毫秒),防止文件保存时频繁触发
  delay = 500
  # 编译失败后停止旧进程
  stop_on_error = true
  # 发送中断信号
  send_interrupt = true
  # 中断后等待时间(秒)
  kill_delay = 2
  # 日志文件名
  log = "air_errors.log"

[build.stats]
  # 构建统计
  enable = false

[log]
  # 显示日志时间
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # 退出时清理 tmp 目录
  clean_on_exit = true

[screen]
  # 启动时清屏
  clear_on_rebuild = true
  # 保留滚动历史
  keep_scroll = true
