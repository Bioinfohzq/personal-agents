# Copy this file to api/configs/config.yaml for local development.
# Do not commit config.yaml because it may contain database credentials.

app_name: personal-agents-api
env: local

api:
  host: 127.0.0.1
  port: 8080

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  username: "<postgres_user>"
  password: "<postgres_password>"
  name: "<postgres_database>"

auth:
  jwt_secret: "<replace_with_a_long_random_secret>"
  token_ttl_minutes: 10080
